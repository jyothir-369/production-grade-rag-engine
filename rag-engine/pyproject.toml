[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-grade-rag"
version = "0.1.0"
description = "Production-grade RAG engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "llama-index-core>=0.14.0",
    "llama-index-readers-file>=0.5.4",
    "openai>=1.107.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.1",
    "qdrant-client>=1.15.1",
    "requests>=2.32.5",
    "streamlit>=1.49.1",
    "uvicorn>=0.35.0",
    "langchain-community>=0.3.0",
    "google-genai>=1.0.0"
]

[tool.setuptools]
py-modules = [
    "main",
    "data_loader",
    "vector_db",
    "streamlit_app",
    "test_retrieval",
    "custom_types"
]